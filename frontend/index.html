<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CN Train Radar | GrayMammoth</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚄</text></svg>">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="map"></div>

  <!-- Train detail panel -->
  <div id="train-detail"></div>

  <!-- Info panel -->
  <div id="info-panel">
    <h3>🚄 CN Train Radar</h3>
    <div class="stat"><span>Active Trains</span><span class="stat-value" id="train-count">0</span></div>
    <div class="stat"><span id="status-dot"></span><span id="status-text">Loading...</span></div>
    <div class="info-note">Position simulated from timetable</div>
  </div>

  <!-- Legend -->
  <div id="legend">
    <div class="legend-title">Train Type</div>
    <div class="legend-item"><span class="legend-color" style="background:#e53935"></span>G - High Speed</div>
    <div class="legend-item"><span class="legend-color" style="background:#1e88e5"></span>D - EMU</div>
    <div class="legend-item"><span class="legend-color" style="background:#43a047"></span>C - Intercity</div>
    <div class="legend-item"><span class="legend-color" style="background:#fb8c00"></span>Z - Direct</div>
    <div class="legend-item"><span class="legend-color" style="background:#8e24aa"></span>T - Express</div>
    <div class="legend-item"><span class="legend-color" style="background:#757575"></span>K - Fast</div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
