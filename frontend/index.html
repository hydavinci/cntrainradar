<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CN Train Radar | 中国列车雷达</title>
  <meta name="description" content="根据时刻表模拟中国铁路列车位置的实时地图。">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Train Radar">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon.svg">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.openmaptiles.org" crossorigin>
  <link rel="dns-prefetch" href="https://wprd01.is.autonavi.com">
  <link rel="dns-prefetch" href="https://wprd02.is.autonavi.com">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="/css/style.css?v=14">
</head>
<body>
  <div id="map"></div>

  <!-- Train detail panel -->
  <div id="train-detail"></div>

  <!-- Info panel -->
  <div id="info-panel">
    <h3>🚄 中国列车雷达</h3>
    <div class="stat"><span>运行列车</span><span class="stat-value" id="train-count">0</span></div>
    <div class="stat"><span id="status-dot"></span><span id="status-text">加载中...</span></div>
    <div class="info-note">根据时刻表模拟位置</div>
  </div>

  <!-- Filter -->
  <div id="filter-panel">
    <div class="filter-toggle" onclick="toggleFilter()">
      <span>🔍 筛选</span>
    </div>
    <div class="filter-body" id="filter-body">
      <input type="text" id="filter-input" placeholder="车次、线路、车站" oninput="onFilterInput()">
      <div class="filter-stats" id="filter-stats"></div>
      <button class="filter-clear" onclick="clearFilter()">清除</button>
    </div>
  </div>

  <!-- Legend -->
  <div id="legend">
    <div class="legend-title">列车类型</div>
    <div class="legend-item"><span class="legend-color" style="background:#1e88e5"></span>G - 高速动车</div>
    <div class="legend-item"><span class="legend-color" style="background:#e53935"></span>D - 动车组</div>
    <div class="legend-item"><span class="legend-color" style="background:#43a047"></span>C - 城际</div>
    <div class="legend-item"><span class="legend-color" style="background:#fb8c00"></span>Z - 直达</div>
    <div class="legend-item"><span class="legend-color" style="background:#8e24aa"></span>T - 特快</div>
    <div class="legend-item"><span class="legend-color" style="background:#757575"></span>K - 快速</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="/js/app.js?v=40"></script>
</body>
</html>
